# XAMPP — MySQL / MariaDB (optionnel si vous utilisez le MySQL intégré à XAMPP)
# Démarrez MySQL depuis le panneau de contrôle XAMPP, pas ce conteneur.

services:
  redis:
    image: redis:7-alpine
    container_name: marneza-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
